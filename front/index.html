<!doctype html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Map</title>

	<link
		rel="stylesheet"
		href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		crossorigin=""
	>
	<link rel="stylesheet" href="./styles.css">
</head>
<body>
	<div id="status">Chargement de la carte...</div>
	<div id="date-filter" aria-label="Filtres de carte">
		<label for="city-filter">Ville</label>
		<input
			type="text"
			id="city-filter"
			name="city-filter"
			placeholder="Ex: Paris"
			autocomplete="address-level2"
		>

		<label for="date-from">Du</label>
		<input
			type="text"
			id="date-from"
			name="date-from"
			placeholder="JJ/MM/AAAA"
			inputmode="numeric"
			maxlength="10"
			pattern="^\\d{2}/\\d{2}/\\d{4}$"
		>

		<label for="date-to">Au</label>
		<input
			type="text"
			id="date-to"
			name="date-to"
			placeholder="JJ/MM/AAAA"
			inputmode="numeric"
			maxlength="10"
			pattern="^\\d{2}/\\d{2}/\\d{4}$"
		>

		<button type="button" id="apply-filter">Appliquer</button>
	</div>
	<div id="map" aria-label="Carte des mesures de pollution"></div>

	<script
		src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		crossorigin=""
	></script>
	<script src="./map.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Air Quality Dashboard Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #ecf0f1; }
        #sidebar { width: 320px; background: #2c3e50; color: white; padding: 20px; box-sizing: border-box; overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.3); z-index: 1000; }
        #map { flex-grow: 1; }
        h2 { color: #3498db; margin-top: 0; }
        .filter-item { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: #bdc3c7; text-transform: uppercase; letter-spacing: 1px; }
        input, select { width: 100%; padding: 10px; border-radius: 5px; border: none; background: #34495e; color: white; font-size: 14px; }
        input:focus, select:focus { outline: 2px solid #3498db; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .marker-index { background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Filtres Avancés</h2>
    <div class="filter-item">
        <label>Zone Géographique (ZAS)</label>
        <select id="zoneSelect">
            <option value="Toutes">-- Toutes les régions --</option>
        </select>
    </div>
    <div class="filter-item">
        <label>Rechercher une station</label>
        <input type="text" id="siteSearch" placeholder="Ex: Paris, Station 42...">
    </div>
    <div class="filter-item">
        <label>Intervalle de dates</label>
        <input type="date" id="dateStart" style="margin-bottom:8px">
        <input type="date" id="dateEnd">
    </div>
    <div class="filter-item">
        <label>Seuils de pollution (µg/m³)</label>
        <div style="display:flex; gap:10px;">
            <input type="number" id="minVal" value="0" placeholder="Min">
            <input type="number" id="maxVal" value="100" placeholder="Max">
        </div>
    </div>
    <button onclick="loadData()">Appliquer les filtres</button>
    <div id="status" style="margin-top:20px; font-size:0.9em; color:#95a5a6; text-align:center;"></div>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<script>
    const map = L.map('map').setView([46.6033, 1.8883], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markers = L.markerClusterGroup();
    map.addLayer(markers);

    function loadZones() {
        fetch('http://127.0.0.1:8000/api/zones')
            .then(res => res.json())
            .then(zones => {
                const select = document.getElementById('zoneSelect');
                zones.forEach(z => {
                    const opt = document.createElement('option');
                    opt.value = z;
                    opt.innerHTML = z;
                    select.appendChild(opt);
                });
            });
    }

    function loadData() {
        const site = document.getElementById('siteSearch').value;
        const start = document.getElementById('dateStart').value;
        const end = document.getElementById('dateEnd').value;
        const min = document.getElementById('minVal').value;
        const max = document.getElementById('maxVal').value;
        const zone = document.getElementById('zoneSelect').value;
        const status = document.getElementById('status');

        status.innerHTML = "Chargement...";

        let url = `http://127.0.0.1:8000/api/points?min_val=${min}&max_val=${max}`;
        if (start) url += `&date_start=${start}`;
        if (end) url += `&date_end=${end}`;
        if (site) url += `&site=${site}`;
        if (zone !== "Toutes") url += `&zone=${encodeURIComponent(zone)}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                markers.clearLayers();
                status.innerHTML = `<b>${data.length}</b> points affichés`;
                
                data.forEach(p => {
                    if(p.lat && p.lon) {
                        const color = p.valeur > 40 ? '#e74c3c' : p.valeur > 20 ? '#f39c12' : '#27ae60';
                        const icon = L.divIcon({
                            className: 'custom-div',
                            html: `<div class="marker-index" style="background:${color};">${Math.round(p.valeur)}</div>`,
                            iconSize: [35, 35],
                            iconAnchor: [17, 17]
                        });

                        const m = L.marker([p.lat, p.lon], { icon: icon });
                        m.bindPopup(`
                            <div style="font-family: sans-serif;">
                                <h3 style="margin:0; color:#2c3e50;">${p["nom site"]}</h3>
                                <p style="margin:5px 0;"><b>Zone:</b> ${p.Zas}</p>
                                <p style="margin:5px 0;"><b>Valeur:</b> <span style="color:${color}; font-weight:bold;">${p.valeur} µg/m³</span></p>
                                <p style="margin:5px 0; font-size:0.8em; color:gray;">Relevé le: ${p["Date de début"]}</p>
                            </div>
                        `);
                        markers.addLayer(m);
                    }
                });
            })
            .catch(err => {
                status.innerHTML = "<span style='color:#e74c3c'>Erreur API</span>";
                console.error(err);
            });
    }

    loadZones();
    loadData();
</script>
</body>
</html>
